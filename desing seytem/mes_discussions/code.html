<span class="bg-tertiary-fixed text-on-tertiary-fixed font-label-md text-label-md uppercase px-2 py-1 rounded w-max">En attente</span>
</div>
<div class="flex flex-col items-end gap-1">

</div>

<p class="font-body-md text-body-md text-on-surface-variant line-clamp-2 w-full pr-8">

</div>

</button>
</div>

        </button>
</div>

<span class="material-symbols-outlined" style="font-size: 28px;">add</span>
</button>
</div>
<script>
    // Optional micro-interaction: Toggle empty state when search is "empty"
    const searchInput = document.querySelector('input[type="text"]');
    const list = document.getElementById('conversation-list');
    const emptyState = document.getElementById('empty-state');

    searchInput.addEventListener('input', (e) => {
        if (e.target.value.toLowerCase() === 'empty') {
            list.classList.add('hidden');
            emptyState.classList.remove('hidden');
            emptyState.classList.add('flex');
        } else {
            list.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
        }
    });
